name: Add noindex to report HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-noindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add robots noindex meta to reports
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("2026-06-22_to_06-30_valko_analysis_report.html"),
              Path("valko_0731_additional_investigation_2026-08-13_ja.html"),
              Path("valko_0731_post_attribution_audit_FINAL_2026-08-13_ja.html"),
          ]
          tag = '<meta name="robots" content="noindex,nofollow">'

          for path in files:
              text = path.read_text(encoding="utf-8")
              if tag in text:
                  continue
              marker = '<meta name="viewport"'
              pos = text.find(marker)
              if pos != -1:
                  end = text.find('>', pos)
                  if end != -1:
                      text = text[:end+1] + '\n' + tag + text[end+1:]
                  else:
                      raise RuntimeError(f"viewport meta tag is malformed: {path}")
              else:
                  head = text.find('<head>')
                  if head == -1:
                      raise RuntimeError(f"<head> not found: {path}")
                  insert_at = head + len('<head>')
                  text = text[:insert_at] + '\n' + tag + text[insert_at:]
              path.write_text(text, encoding="utf-8")

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026-06-22_to_06-30_valko_analysis_report.html \
                  valko_0731_additional_investigation_2026-08-13_ja.html \
                  valko_0731_post_attribution_audit_FINAL_2026-08-13_ja.html
          git commit -m "Add noindex metadata to report pages"
          git push
